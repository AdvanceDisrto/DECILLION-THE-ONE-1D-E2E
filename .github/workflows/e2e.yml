name: E2E verification
on:
  push:
    branches: ['review/**']
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile decillion_one.py tests/test_e2e.py
      - name: End-to-end tests
        run: python -m unittest discover -s tests -v
